<svg
    xmlns="http://www.w3.org/2000/svg"
>
    <defs>
        <style>
            :root {
                --fontStack-sansSerif:"Mona Sans VF", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
                --text-body-size-small: 1rem;
                --text-body-size-big: 1.5rem;
                --base-text-weight-normal: 400;
                --fgColor-default: #f0f6fc;
            }
            .descriptor
            {
                font-family: var(--fontStack-sansSerif);
                font-size: var(--text-body-size-small);
                font-weight: var(--base-text-weight-normal);
                color: var(--fgColor-default);
                fill: var(--fgColor-default);
            }
            .title
            {
                font-size: var(--text-body-size-big);
                text-decoration: underline;
                font-weight: 600;
            }
        </style>
    </defs>

    <g id="month"></g>
  
    <text id="mon" class="descriptor">Mon</text>
    <text id="wed" class="descriptor">Wed</text>
    <text id="fri" class="descriptor">Fri</text>
    
    <text id="monthText" class="descriptor" dominant-baseline="hanging" text-anchor="middle"></text>

    <rect
        id="border"
        x="1"
        y="1"
        width="298"
        rx="10"
        fill="none"
        stroke="#3d444d"
        stroke-width=".0625rem"
    />

    <line
        id="separator"
        stroke="#3d444d"
        stroke-width=".0625rem"
        stroke-linecap="round"
    />

    <text id="statTitle"  dominant-baseline="hanging" text-anchor="middle" class="descriptor title"></text>

</svg>