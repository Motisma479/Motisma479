name: weeklyUpdates

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'
    - cron: '0 12 * * 3'
    
jobs:
  updates:
    runs-on: ubuntu-latest
    steps:
      - name: Check Github CLI presence
        run: gh --version

      - name: Compute Dates
        id: date
        run: |
          echo "monthStart=$(date -u +'%Y-%m-01T00:00:00Z')" >> "$GITHUB_OUTPUT"
          echo "monthEnd=$(date -u -d "$(date -u +'%Y-%m-01') +1 month -1 day" +'%Y-%m-%dT23:59:59Z')" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
     
      - name: Fetch Contributions
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh api graphql \
            -F from="${{steps.date.outputs.monthStart}}" \
            -F to="${{steps.date.outputs.monthEnd}}" \
            -f query='
            query($from: DateTime!, $to: DateTime!) {
              viewer {
                contributionsCollection(from: $from, to: $to) {
                  totalCommitContributions
                  totalIssueContributions
                  totalPullRequestContributions
                  totalPullRequestReviewContributions
                  totalRepositoriesWithContributedCommits
                  totalRepositoriesWithContributedIssues
                  totalRepositoriesWithContributedPullRequestReviews 
                  totalRepositoriesWithContributedPullRequests 
                  totalRepositoryContributions 
                  contributionCalendar {
                    totalContributions
                    weeks {
                      contributionDays {
                        contributionCount
                        date
                        contributionLevel
                      } 
                    }
                  }
                }
              }
            }' > contributions.json

      - name: Generate Monthly Graph
        run: python Tools/GenerateMonthlyGraph.py contributions.json

      - name: Commit and push
        run: |
          TOTAL=$(python -c "import json;print(json.load(open('contributions.json'))['data']['viewer']['contributionsCollection']['contributionCalendar']['totalContributions'])")
          LAST=0
          if [ -f .github/.lastWorkflow ]; then
            LAST=$(cat .github/.lastWorkflow)
          fi

          if [ "$TOTAL" = "$LAST" ]; then
            echo "No new contributions."
            exit 0
          fi

          echo "$((TOTAL + 1))" > .github/.lastWorkflow
          
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add -A
          git commit -m "[Workflow] Weekly Updates: $TOTAL contributions in the last month"
          git push