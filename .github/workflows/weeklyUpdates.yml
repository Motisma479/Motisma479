name: weeklyUpdates

permissions:
  contents: write

on:
  workflow_dispatch:
   
jobs:
  updates:
    runs-on: ubuntu-latest
    steps:
      - name: Check Github CLI presence
        run: gh --version

      - name: Compute Dates
        id: date
        run: |
          echo "monthStart=$(date -u +'%Y-%m-01T00:00:00Z')" >> "$GITHUB_OUTPUT"
          echo "monthEnd=$(date -u -d "$(date -u +'%Y-%m-01') +1 month -1 day" +'%Y-%m-%dT23:59:59Z')" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
     
      - name: Fetch Contributions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api graphql \
            -F login="${{github.repository_owner}}" \
            -F from="${{steps.date.outputs.monthStart}}" \
            -F to="${{steps.date.outputs.monthEnd}}}" \
            -f query='
            query($login: String!, $from: DateTime!, $to: DateTime!) {
              user(login: $login) {
                contributionsCollection(from: $from, to: $from) {
                  totalCommitContributions
                  totalIssueContributions
                  totalPullRequestContributions
                  totalRepositoryContributions
                  contributionCalendar {
                    weeks {
                      contributionDays {
                        contributionCount
                        date
                        contributionLevel
                      } 
                    }
                  }
                }
              }
            }' > contributions.json
      
      - name: Upload contribution data
        uses: actions/upload-artifact@v7
        with:
          name: contributions-data
          path: contributions.json

